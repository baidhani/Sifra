<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sifra Vault</title>
  <style>
    :root {
      --brand-blue: #2563eb;
      --text-dim: #6b7280;
      --border: #e5e7eb;
      --text: #111827;
      --bg: #ffffff;
      --surface: #f3f4f6;
      --surface-hover: #e5e7eb;
      --success: #15803d;
      --error: #b91c1c;
      --warning: #b45309;
    }
    /* Follows the OS/browser's own dark-mode setting — the cheap, no-plumbing
       way to theme this popup. It does NOT read Sifra Desktop's own
       Light/Dark/System preference (that would need a native-messaging round
       trip to ask the desktop app, which isn't worth it purely for the
       popup's colors — see this session's discussion, 2026-09-23). */
    /* Neutral near-black, not the earlier blue-tinted dark gray (#1f2937) —
       matching Chrome's own save-password dialog. A background sharing the
       accent's blue hue made the brand-blue buttons/icons compete with it
       instead of standing out against it; a neutral background lets the
       one accent color read cleanly (2026-09-23 design pass). */
    @media (prefers-color-scheme: dark) {
      :root {
        --text-dim: #9a9a9a;
        --border: #3a3a3a;
        --text: #f3f4f6;
        --bg: #1e1e1e;
        --surface: #2a2a2a;
        --surface-hover: #3a3a3a;
        --success: #4ade80;
        --error: #f87171;
        --warning: #fbbf24;
      }
    }
    body {
      font: 14px system-ui, sans-serif;
      width: 260px;
      margin: 0;
      padding: 16px;
      color: var(--text);
      background: var(--bg);
    }
    /* Full-bleed shaded bar (negative margin cancels body's own padding) so
       the fixed logo/title row reads as a distinct header sitting above the
       scrolling match list below it, rather than blending into the body
       background the list scrolls underneath. */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -16px -16px 0 -16px;
      padding: 14px 16px 6px 16px;
      background: var(--surface);
    }
    header img { width: 24px; height: 24px; }
    header span { font-size: 15px; font-weight: 600; }
    /* #unlockedView's own header row (below) continues this same shaded
       bar with no gap; the other two views just need the space back that
       header's own margin-bottom used to provide. */
    #unpairedView, #lockedView { margin-top: 14px; }
    p { margin: 0 0 10px; color: var(--text-dim); line-height: 1.4; }
    label { display: block; margin-bottom: 4px; color: var(--text-dim); font-size: 12px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      /* Text inputs default to a browser-native white fill regardless of
         page theme unless explicitly overridden — left unset, this showed
         a bright white box in the middle of an otherwise dark popup. */
      background: var(--surface);
      color: var(--text);
    }
    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-weight: 500;
      background: var(--brand-blue);
      color: #fff;
    }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary { background: transparent; color: var(--text-dim); margin-top: 6px; }
    .unlockedHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -16px 10px -16px;
      padding: 4px 16px 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .unlockedHeader span { font-size: 12px; color: var(--text-dim); }
    .iconButton {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--text);
      border-radius: 50%;
    }
    .iconButton:hover { background: var(--surface-hover); }
    /* Chrome caps a popup's own height (~600px) and clips anything past
       that with no way to reach it — no scrollbar appears on its own. This
       scrolls the match list itself once it grows past a sane size, well
       before hitting Chrome's hard cap, so the header/lock button/status
       line stay reachable and a long list is still fully browsable. */
    #matchesList {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0 -4px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-color: var(--surface-hover) transparent;
      scrollbar-width: thin;
    }
    /* scrollbar-color above covers Firefox; Chrome (what this extension
       actually runs in) still needs the older WebKit pseudo-elements to
       theme the scrollbar instead of showing the OS default. */
    #matchesList::-webkit-scrollbar { width: 8px; }
    #matchesList::-webkit-scrollbar-track { background: transparent; }
    #matchesList::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    #matchesList::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    .matchRow {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 6px;
    }
    .matchRow:hover { background: var(--surface); }
    .matchMain {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      text-align: left;
      background: transparent;
      color: var(--text);
      padding: 4px;
      border-radius: 8px; /* a normal list row, not a pill CTA button — overrides the global button rule */
    }
    .matchLabel { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .matchUsername { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .matchUsername.empty { color: var(--warning); }
    .copyButton {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text-dim);
      /* Hidden until the row is hovered/focused (below) — showing both copy
         icons on every row at once was visual clutter for actions most
         rows won't need at any given moment. */
      opacity: 0;
      transition: opacity .1s ease;
    }
    .matchRow:hover .copyButton,
    .matchRow:focus-within .copyButton {
      opacity: 1;
    }
    .copyButton:hover { background: var(--surface-hover); color: var(--text); }
    .copyButton:disabled { opacity: .4; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-height: 14px;
    }
    #status .icon { flex-shrink: 0; margin-top: 1px; }
    #status.success { color: var(--success); }
    #status.error { color: var(--error); }
    #status.info { color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <img src="icons/symbol128.png" alt="Sifra" />
    <span>Sifra Vault</span>
  </header>
  <div id="unpairedView">
    <p>Connect this browser to Sifra Desktop to enable autofill.</p>
    <button id="pairButton">Pair with Desktop</button>
  </div>
  <div id="lockedView" hidden>
    <label for="password">Vault master password</label>
    <input type="password" id="password" autocomplete="off" />
    <button id="unlockButton">Unlock for this session</button>
  </div>
  <div id="unlockedView" hidden>
    <div class="unlockedHeader">
      <span>Unlocked until browser restart</span>
      <button id="lockButton" class="iconButton" title="Lock vault" aria-label="Lock vault">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
          <rect x="4.5" y="9" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
    <p id="matchesEmpty">Visit a saved login page to see autofill.</p>
    <div id="matchesList" hidden></div>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
